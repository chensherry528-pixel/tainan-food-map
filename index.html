<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="探索台南東區、北區、中西區、安平區與永康區的在地美食。"><title>台南慢食地圖｜在地美食搜尋</title>
<style>
:root{--g:#31483a;--cream:#f7f2e8;--paper:#fffdf8;--ink:#2b302a;--muted:#74796f;--clay:#c46b45;--line:#e8dfd0;--gold:#d7b77b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}header,footer{background:var(--g);color:white;padding:18px 0}.brand{font-size:20px;font-weight:800}.brand small{display:block;color:#d8e0d5;font-size:11px;letter-spacing:2px}.hero{background:linear-gradient(120deg,#23362b,#49634f);color:white;padding:46px 0 36px}.eyebrow{color:#e4c99a;font-size:12px;letter-spacing:2px;font-weight:700}.hero h1{font-size:clamp(32px,5vw,50px);line-height:1.2;margin:12px 0}.hero p{color:#e4e9e1;max-width:650px}.panel{background:var(--paper);color:var(--ink);padding:18px;border-radius:16px;box-shadow:0 12px 35px #0002}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px;background:white}.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:var(--clay);color:white;align-self:end;min-height:44px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid #ffffff66;background:#ffffff12;color:white;border-radius:999px;padding:6px 13px;cursor:pointer}.chip.active,.chip:hover{background:var(--gold);color:var(--g)}main{padding:32px 0 55px}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:15px}.heading h2{margin:0;font-size:24px}.muted{color:var(--muted);font-size:13px}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:0 0 30px}.cat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 5px;cursor:pointer;text-align:center}.cat.active,.cat:hover{background:#e9eee6;border-color:var(--g)}.cat span{display:block;font-size:24px}.cat b{font-size:13px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cardtop{height:100px;display:grid;place-items:center;background:linear-gradient(135deg,#e7d7bc,#c9b28e);font-size:42px}.cardbody{padding:14px}.card h3{margin:0 0 5px;font-size:17px}.card p{font-size:14px;min-height:44px}.tag{font-size:12px;color:var(--muted)}.cardbottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}.map{font-size:13px;color:var(--g);font-weight:700;text-decoration:none}.notice{margin-top:22px;padding:14px;border:1px solid #e2d3bb;background:#f0e7d7;color:#655844;border-radius:10px;font-size:13px}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--muted);background:var(--paper);border-radius:12px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .field:first-child,.primary{grid-column:1/-1}.categories{grid-template-columns:repeat(3,1fr)}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.filters,.results{grid-template-columns:1fr}.filters .field:first-child,.primary{grid-column:auto}.hero{padding-top:34px}.heading h2{font-size:20px}}
</style></head><body>
<header><div class="wrap"><div class="brand">台南慢食地圖<small>TAINAN LOCAL FOOD GUIDE</small></div></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">LOCAL TASTE · TAINAN</div><h1>今天在台南，<br>想吃點什麼？</h1><p>從巷弄小吃到咖啡甜點，選區域、挑口味，慢慢找到合你心意的台南味。</p><div class="panel"><div class="filters"><div class="field"><label for="q">搜尋美食</label><input id="q" placeholder="店名、料理，例如：牛肉湯"></div><div class="field"><label for="d">行政區</label><select id="d"><option value="">全部五區</option><option>東區</option><option>北區</option><option>中西區</option><option>安平區</option><option>永康區</option></select></div><div class="field"><label for="c">料理類型</label><select id="c"><option value="">全部類型</option><option>台式小吃</option><option>早餐早午餐</option><option>火鍋熱炒</option><option>咖啡甜點</option><option>麵食飯類</option><option>海鮮料理</option></select></div><button class="btn primary" id="go">搜尋美食 ↗</button></div><div class="chips"><button class="chip active" data-d="">全部區域</button><button class="chip" data-d="東區">東區</button><button class="chip" data-d="北區">北區</button><button class="chip" data-d="中西區">中西區</button><button class="chip" data-d="安平區">安平區</button><button class="chip" data-d="永康區">永康區</button></div></div></div></section>
<main class="wrap"><div class="heading"><div><h2>依照今天的胃口探索</h2><div class="muted">選擇料理類型，快速縮小搜尋範圍。</div></div></div><div class="categories" id="cats"><button class="cat" data-c="台式小吃"><span>🍲</span><b>台式小吃</b></button><button class="cat" data-c="早餐早午餐"><span>🥪</span><b>早餐早午餐</b></button><button class="cat" data-c="火鍋熱炒"><span>🍲</span><b>火鍋熱炒</b></button><button class="cat" data-c="咖啡甜點"><span>☕</span><b>咖啡甜點</b></button><button class="cat" data-c="麵食飯類"><span>🍜</span><b>麵食飯類</b></button><button class="cat" data-c="海鮮料理"><span>🦐</span><b>海鮮料理</b></button></div><div class="heading"><div><h2>美食探索清單</h2><div class="muted">目前為功能示範資料，公開前請換成已查證店家。</div></div><span class="muted" id="count"></span></div><div class="results" id="results"></div><div class="notice"><b>資料提醒：</b>目前清單為網站功能示範，不代表實際營業店家或推薦名單。地圖按鈕會開啟 Google Maps 搜尋；地址、營業時間及價格請以店家最新資訊為準。</div></main><footer><div class="wrap">© <span id="year"></span> 台南慢食地圖｜在地美食搜尋</div></footer>
<script>
const DATA=[
{name:"東區在地小吃（示範）",d:"東區",c:"台式小吃",price:"平價",kw:"小吃 台灣料理 午餐",desc:"請替換成已查證的實際店家與招牌料理。",e:"🍲"},
{name:"東區早午餐（示範）",d:"東區",c:"早餐早午餐",price:"約 100–300 元",kw:"早餐 早午餐 吐司 咖啡",desc:"示範早餐與早午餐分類搜尋。",e:"🥪"},
{name:"北區牛肉湯（示範）",d:"北區",c:"台式小吃",price:"價格待確認",kw:"牛肉湯 早餐 台南小吃",desc:"請填入實際店家的招牌品項、地址與價格。",e:"🥣"},
{name:"北區麵食飯類（示範）",d:"北區",c:"麵食飯類",price:"平價",kw:"麵食 飯類 午餐 晚餐",desc:"示範依麵食、飯類關鍵字搜尋。",e:"🍜"},
{name:"中西區老店小吃（示範）",d:"中西區",c:"台式小吃",price:"平價",kw:"古早味 小吃 觀光 美食",desc:"可整理中西區巷弄小吃與老店名單。",e:"🍢"},
{name:"中西區咖啡甜點（示範）",d:"中西區",c:"咖啡甜點",price:"約 100–250 元",kw:"咖啡 甜點 下午茶",desc:"示範咖啡館與甜點店分類。",e:"☕"},
{name:"安平區海鮮料理（示範）",d:"安平區",c:"海鮮料理",price:"價格待確認",kw:"海鮮 魚料理 聚餐",desc:"請核實店家地址、價格與營業資訊。",e:"🦐"},
{name:"安平區台式小吃（示範）",d:"安平區",c:"台式小吃",price:"平價",kw:"安平 小吃 古早味",desc:"示範安平區在地美食搜尋。",e:"🍲"},
{name:"永康區火鍋熱炒（示範）",d:"永康區",c:"火鍋熱炒",price:"約 200–500 元",kw:"火鍋 熱炒 聚餐",desc:"示範火鍋與熱炒分類。",e:"🍲"},
{name:"永康區麵食飯類（示範）",d:"永康區",c:"麵食飯類",price:"平價",kw:"麵食 飯類 午餐",desc:"請換成已查證的店家資料。",e:"🍜"}];
const $=s=>document.querySelector(s);let cat="";
function render(){let q=$("#q").value.trim().toLowerCase(),d=$("#d").value,c=$("#c").value||cat;let a=DATA.filter(x=>(!q||(x.name+x.kw+x.desc+x.d+x.c).toLowerCase().includes(q))&&(!d||x.d===d)&&(!c||x.c===c));$("#count").textContent="共 "+a.length+" 筆";$("#results").innerHTML=a.length?a.map(x=>'<article class="card"><div class="cardtop">'+x.e+'</div><div class="cardbody"><h3>'+x.name+'</h3><div class="tag">'+x.d+' · '+x.c+'</div><p>'+x.desc+'</p><div class="cardbottom"><b>'+x.price+'</b><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("台南市"+x.d+" "+x.name.replace("（示範）",""))+'">地圖搜尋 ↗</a></div></div></article>').join(""):'<div class="empty">找不到符合條件的項目，請試試其他關鍵字或區域。</div>';document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.c===cat));document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.d===d))}
$("#go").onclick=render;$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")render()});$("#d").onchange=render;$("#c").onchange=()=>{cat="";render()};document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("#d").value=b.dataset.d;render()});document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=cat===b.dataset.c?"":b.dataset.c;$("#c").value="";render()});$("#year").textContent=new Date().getFullYear();render();
</script></body></html>
